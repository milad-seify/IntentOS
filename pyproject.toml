[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentos-engineering"
version = "1.0.0"
description = "Engineering intent into reliable AI execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Milad Seify"}]
dependencies = []

[project.urls]
Repository = "https://github.com/milad-seify/IntentOS"
Issues = "https://github.com/milad-seify/IntentOS/issues"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
intentos = "intentos.cli:main"
intentos-mcp = "intentos.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
