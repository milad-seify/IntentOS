<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="intentos-csrf" content="__INTENTOS_CSRF__">
  <meta name="color-scheme" content="light dark">
  <title>IntentOS — Reliable AI Delegation</title>
  <link rel="stylesheet" href="/ui.css">

</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="rail" aria-label="IntentOS navigation">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>IntentOS</span></div>
      <p class="rail-subtitle">Reliable AI Delegation</p>
      <nav id="navigation" aria-label="Workflows"></nav>
      <div class="rail-foot"><span class="local-dot" aria-hidden="true"></span>Running on this computer<br><small>No provider account required to prepare.</small></div>

      <header class="topbar"><span>Local workbench</span><div class="topbar-tools"><span class="topbar-note">You review. Your AI tool executes.</span><button id="theme" type="button" aria-label="Change color theme">Theme: System</button></div></header>

        <div id="workspace"></div>
        <div id="feedback" role="status" aria-live="polite"></div>
        <section id="result" class="result" aria-live="polite" hidden></section>
      </main>
    </div>
  </div>
