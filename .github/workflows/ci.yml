name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: intentos optimize "Write a short announcement" --target chatgpt --json

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: intentos optimize "Write a short announcement" --target chatgpt --json

  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package with MCP support
        run: python -m pip install -e ".[mcp]"
      - name: Run MCP in-memory protocol smoke
        run: python tests/mcp_smoke.py
      - name: Run MCP stdio host parity dogfood
        run: python tests/mcp_stdio_parity.py

  vscode-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check VS Code extension syntax
        run: node --check integrations/vscode/extension.js
