name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: intentos optimize "Write a short announcement" --target chatgpt --json

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: intentos optimize "Write a short announcement" --target chatgpt --json

  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package with MCP support
        run: python -m pip install -e ".[mcp]"
      - name: Run MCP in-memory protocol smoke
        run: python tests/mcp_smoke.py
      - name: Run MCP stdio host parity dogfood
        run: python tests/mcp_stdio_parity.py

  vscode-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check VS Code extension syntax
        run: node --check integrations/vscode/extension.js

  distribution-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Inspect distribution contents
        run: python tests/check_distribution_artifacts.py "$RUNNER_TEMP"/dist/*
      - name: Install and smoke-test core wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/core-venv"
          "$RUNNER_TEMP/core-venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core-venv/bin/python" - <<'PY'
          import importlib.util
          import pathlib
          import sysconfig
          import intentos

          package = pathlib.Path(intentos.__file__).resolve()
          site_packages = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          assert package.is_relative_to(site_packages), (package, site_packages)
          assert importlib.util.find_spec("mcp") is None, "core wheel unexpectedly installed MCP"
          PY
          "$RUNNER_TEMP/core-venv/bin/intentos" --help
          "$RUNNER_TEMP/core-venv/bin/intentos" optimize "Codex: preserve behavior → فارسی" --target codex --json > "$RUNNER_TEMP/core.json"
          "$RUNNER_TEMP/core-venv/bin/python" -m intentos optimize "Codex: preserve behavior → فارسی" --target codex --json > "$RUNNER_TEMP/module.json"
          "$RUNNER_TEMP/core-venv/bin/python" - "$RUNNER_TEMP/core.json" "$RUNNER_TEMP/module.json" <<'PY'
          import json
          import sys

          for filename in sys.argv[1:]:
              with open(filename, encoding="utf-8") as stream:
                  result = json.load(stream)
              assert result["status"] == "ready", result
              assert "→" in result["intent"]["goal"] and "فارسی" in result["intent"]["goal"]
          PY
      - name: Install and smoke-test MCP wheel extra in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/mcp-venv"
          export PATH="$RUNNER_TEMP/mcp-venv/bin:$PATH"
          wheel=$(echo "$RUNNER_TEMP"/dist/*.whl)
          "$RUNNER_TEMP/mcp-venv/bin/python" -m pip install "${wheel}[mcp]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-venv/bin/python" - <<'PY'
          import importlib.metadata
          import pathlib
          import sysconfig
          import intentos

          package = pathlib.Path(intentos.__file__).resolve()
          site_packages = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          assert package.is_relative_to(site_packages), (package, site_packages)
          entry_points = importlib.metadata.entry_points(group="console_scripts")
          assert any(item.name == "intentos-mcp" for item in entry_points)
          PY
          "$RUNNER_TEMP/mcp-venv/bin/python" "$GITHUB_WORKSPACE/tests/mcp_smoke.py"
          "$RUNNER_TEMP/mcp-venv/bin/python" "$GITHUB_WORKSPACE/tests/mcp_stdio_parity.py"
      - name: Install and smoke-test source distribution in a clean environment
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-source"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist-source"
          sdist_source=$(find "$RUNNER_TEMP/sdist-source" -mindepth 1 -maxdepth 1 -type d)
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install "$sdist_source"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -c 'import intentos, pathlib, sysconfig; package = pathlib.Path(intentos.__file__).resolve(); site = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve(); assert package.is_relative_to(site), (package, site)'
          "$RUNNER_TEMP/sdist-venv/bin/intentos" --help
          "$RUNNER_TEMP/sdist-venv/bin/intentos" optimize "Codex: preserve behavior → فارسی" --target codex --json > "$RUNNER_TEMP/sdist.json"
          "$RUNNER_TEMP/sdist-venv/bin/python" - "$RUNNER_TEMP/sdist.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          assert result["status"] == "ready" and "فارسی" in result["intent"]["goal"]
          PY
