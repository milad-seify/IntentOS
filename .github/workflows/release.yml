name: Release

on:
  push:
    tags:
      - "v*"
      - "!vscode-v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag and distribution identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tests/check_release_tag.py "$RELEASE_TAG"
      - name: Require accepted main history
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Validate exact release artifacts
        run: python tests/validate_distribution_artifacts.py "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    needs: build-and-verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/intentos-engineering
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/
          digest-mismatch: error
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
