name: VS Code Marketplace

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify tag version and accepted main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"vscode-v(\d+\.\d+\.\d+)", tag)
          manifest = json.loads(Path("integrations/vscode/package.json").read_text())
          assert match and manifest["version"] == match.group(1), "Tag version must match extension package.json"
          assert manifest["publisher"] == "milad-seyfi" and manifest["name"] == "intentos-vscode", "Unexpected extension identity"
          PY
          git fetch --no-tags https://github.com/${{ github.repository }}.git +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Install the local IntentOS CLI for runtime checks
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Run VS Code contract and syntax checks
        run: |
          python -m unittest tests.test_vscode_extension_contract -v
          node --check integrations/vscode/extension.js
          node --check integrations/vscode/executable.js
      - name: Package one VSIX
        working-directory: integrations/vscode
        run: |
          mkdir -p "$RUNNER_TEMP/vscode-vsix"
          npx --yes @vscode/vsce@4.1.0 package --out "$RUNNER_TEMP/vscode-vsix/intentos-vscode-${GITHUB_REF_NAME#vscode-v}.vsix"
          npx --yes @vscode/vsce@4.1.0 ls
      - name: Verify packaged VSIX contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tests/validate_vscode_marketplace_package.py "$RELEASE_TAG" "$RUNNER_TEMP/vscode-vsix/intentos-vscode-${GITHUB_REF_NAME#vscode-v}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intentos-vscode-vsix
          path: ${{ runner.temp }}/vscode-vsix/intentos-vscode-*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intentos-vscode-vsix
          path: dist/
          digest-mismatch: error
      - name: Publish the verified VSIX with Marketplace Trusted Publishing
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath dist/intentos-vscode-${GITHUB_REF_NAME#vscode-v}.vsix --oidc
